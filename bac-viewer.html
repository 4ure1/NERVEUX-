<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<title>Sujet BAC — NERVEUX</title>
<meta name="description" content="Sujet et correction complète d'un examen du Baccalauréat — NERVEUX Maths Terminale D Burkina Faso">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- MathJax config -->
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },
  startup: {
    pageReady: function(){
      return MathJax.startup.defaultPageReady().then(revealPage);
    }
  }
};
function revealPage(){
  document.body.classList.add('ready');
  var l=document.getElementById('mj-loader');
  if(l){ l.classList.add('hide'); setTimeout(function(){ l.remove(); },400); }
}
setTimeout(revealPage, 6000);
(function loadMJ(srcs,i){
  if(i>=srcs.length){revealPage();return;}
  var s=document.createElement('script');
  s.src=srcs[i]; s.async=true;
  s.onerror=function(){loadMJ(srcs,i+1);};
  document.head.appendChild(s);
})([
  'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js',
  'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js',
  'https://unpkg.com/mathjax@3/es5/tex-svg.js'
],0);
</script>

<style>
  /* ── VARIABLES NERVEUX ── */
  :root{
    --navy:     #222d46;
    --navy-deep:#0b2c5f;
    --gold:     #d4a017;
    --gold-dim: rgba(212,160,23,0.15);
    --gold-pale: rgba(212,160,23,0.07);
    --bg:       #f0f3f9;
    --surface:  #ffffff;
    --surface2: #f7f9fc;
    --border:   #dde1ec;
    --text:     #1a1a2e;
    --text2:    #6a7080;
    --green:    #1a7a5e;
    --green-dim:rgba(26,122,94,0.1);
    --red:      #b83232;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }

  body{
    background:var(--bg); color:var(--text);
    font-family:'Nunito', sans-serif;
    line-height:1.7; width:100%; overflow-x:hidden;
    opacity:0; transition:opacity .4s ease;
  }
  body.ready{opacity:1;}

  /* ── LOADER ── */
  #mj-loader{
    position:fixed; inset:0; background:var(--navy); z-index:999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Nunito', sans-serif; color:rgba(255,255,255,.5); gap:16px;
    transition:opacity .35s ease;
  }
  #mj-loader.hide{opacity:0; pointer-events:none;}
  .mj-spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid rgba(255,255,255,.15); border-top-color:var(--gold);
    animation:mjspin .8s linear infinite;
  }
  @keyframes mjspin{to{transform:rotate(360deg);}}
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

  /* ── TOPBAR ── */
  .topbar{
    background:var(--navy); color:white;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 32px; height:64px; width:100%;
    box-shadow:0 2px 12px rgba(0,0,0,.18); position:sticky; top:0; z-index:200;
  }
  .topbar-left{ display:flex; align-items:center; gap:12px; }
  .topbar-brand{
    font-weight:900; font-size:18px; letter-spacing:1px;
    color:white; text-decoration:none; font-family:'Nunito',sans-serif;
  }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .return-link{
    display:flex; align-items:center; gap:7px;
    font-size:13px; font-weight:700; color:rgba(255,255,255,.65);
    text-decoration:none; font-family:'Nunito',sans-serif;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:40px; padding:7px 16px; transition:all .2s;
  }
  .return-link:hover{ background:rgba(255,255,255,.15); color:white; border-color:var(--gold); }

  /* ── HERO BAND ── */
  .bac-hero{
    background:linear-gradient(135deg, var(--navy) 0%, #2a3a60 60%, var(--navy-deep) 100%);
    padding:40px 24px 30px; text-align:center;
    border-bottom:3px solid var(--gold);
    position:relative; overflow:hidden;
  }
  .bac-hero::before{
    content:'∑ ∫ π √ ≠ ∞ Δ θ';
    position:absolute; top:6px; left:0; right:0;
    font-size:80px; opacity:.03; letter-spacing:20px; pointer-events:none; color:white;
  }
  .bac-hero-label{
    display:inline-block; background:var(--gold-dim); border:1px solid rgba(212,160,23,.35);
    color:var(--gold); border-radius:20px; padding:4px 14px;
    font-size:11px; font-weight:900; letter-spacing:1px; text-transform:uppercase;
    margin-bottom:12px;
  }
  .bac-hero h1{
    font-family:'Merriweather', serif; font-size:clamp(18px,4vw,28px);
    color:white; font-weight:700; letter-spacing:0; animation:none;
    background:none; -webkit-background-clip:unset; background-clip:unset;
    -webkit-text-fill-color:unset; margin-bottom:6px;
  }
  .bac-hero .subtitle{
    color:rgba(255,255,255,.5); font-size:14px; font-style:italic;
    font-family:'Nunito',sans-serif; margin-bottom:0;
  }

  /* ── CONTENEUR ── */
  .bac-container{
    max-width:860px; margin:0 auto; padding:32px 20px 100px;
  }

  /* ── TYPOGRAPHIE DU CONTENU ── */
  #bac-content h1{
    font-family:'Merriweather', serif;
    font-size:1.55em; font-weight:700; color:var(--navy);
    text-align:center; margin:28px 0 6px;
    background:none; -webkit-background-clip:unset; background-clip:unset;
    -webkit-text-fill-color:unset; animation:none; letter-spacing:0;
  }
  #bac-content .subtitle{
    text-align:center; color:var(--text2); font-style:italic;
    margin-bottom:28px; font-size:0.92em;
  }
  #bac-content h2{
    font-family:'Nunito',sans-serif; font-size:1.15em; font-weight:900;
    color:var(--navy); border-bottom:2px solid var(--gold-dim);
    padding-bottom:8px; margin-top:48px; margin-bottom:4px;
    letter-spacing:0.3px; display:flex; align-items:center; gap:10px;
  }
  #bac-content h2::before{
    content:''; display:inline-block; width:4px; height:1.1em;
    background:var(--gold); border-radius:2px; flex-shrink:0;
  }
  #bac-content h3{
    font-family:'Nunito',sans-serif; color:var(--navy-deep);
    margin-top:30px; font-size:1em; font-weight:800;
  }
  #bac-content h4{
    font-family:'Nunito',sans-serif; color:var(--navy);
    margin-top:22px; font-size:0.95em; font-weight:800; opacity:.75;
  }
  #bac-content p{ margin:10px 0; font-size:0.97em; }
  #bac-content ol, #bac-content ul{ padding-left:22px; margin:10px 0; }
  #bac-content li{ margin-bottom:5px; font-size:0.95em; }
  #bac-content strong{ color:var(--navy); }

  /* ── INFOBLOCK (tableau en-tête sujet) ── */
  .infoblock{
    background:var(--surface); border:1.5px solid var(--border);
    border-top:3px solid var(--gold);
    border-radius:0 0 10px 10px; padding:16px 20px; margin:20px 0;
    font-family:'Nunito',sans-serif; font-size:0.88em;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
  }
  .infoblock table{width:100%; border-collapse:collapse;}
  .infoblock td{ padding:5px 10px; color:var(--text2); }
  .infoblock td.val{ color:var(--navy); font-weight:800; }

  /* ── .points (barème) ── */
  .points{ color:var(--text2); font-style:italic; font-size:0.88em; font-weight:600; }

  /* ── ÉTAPE DE CORRECTION ── */
  .step{
    background:var(--surface); border-left:4px solid var(--navy);
    border-radius:0 10px 10px 0; padding:14px 18px; margin:14px 0;
    box-shadow:0 1px 5px rgba(0,0,0,.05); overflow-x:auto;
  }
  .step .label{
    display:block; font-family:'Nunito',sans-serif; font-weight:900;
    color:var(--navy); margin-bottom:8px;
    text-transform:uppercase; font-size:0.78em; letter-spacing:0.8px;
  }
  .step.alt{ border-left-color:var(--gold); }
  .step.alt .label{ color:var(--gold); }

  /* ── RÉSULTAT ── */
  .result{
    background:rgba(212,160,23,0.07);
    border:1.5px solid rgba(212,160,23,.35); border-radius:10px;
    padding:16px 18px; margin:16px 0; overflow-x:auto;
  }
  .result .label{
    display:block; font-family:'Nunito',sans-serif; font-weight:900;
    color:var(--gold); text-transform:uppercase; font-size:0.78em;
    letter-spacing:1px; margin-bottom:8px;
  }

  /* ── NOTE ── */
  .note{
    border:1.5px dashed rgba(212,160,23,.4); border-radius:10px;
    padding:14px 18px; margin:16px 0;
    background:rgba(212,160,23,.04); font-size:0.94em; overflow-x:auto;
  }
  .note .label{
    display:block; font-family:'Nunito',sans-serif; font-weight:900;
    color:var(--gold); margin-bottom:6px; font-size:0.85em;
  }

  /* ── RAPPEL DE COURS — collapsible ── */
  .rappel-wrap{
    border:1.5px solid rgba(212,160,23,.3); border-radius:10px;
    margin:18px 0 24px; overflow:hidden;
    box-shadow:0 1px 6px rgba(0,0,0,.05);
  }
  .rappel-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; cursor:pointer; user-select:none;
    background:rgba(212,160,23,.08); border:none; width:100%;
    font-family:'Nunito',sans-serif; font-weight:900; font-size:0.8em;
    color:var(--navy); text-transform:uppercase; letter-spacing:1px;
    transition:background .2s;
  }
  .rappel-wrap.open .rappel-toggle{ background:rgba(212,160,23,.14); }
  .rappel-toggle:hover{ background:rgba(212,160,23,.18); }
  .rappel-toggle-left{ display:flex; align-items:center; gap:10px; }

  /* ── SVG Cerveau (rappel toggle icon) ── */
  .brain-icon{
    width:26px; height:24px; flex-shrink:0;
    color:var(--navy); display:block;
    transition:color .35s ease, transform .3s ease;
  }
  .rappel-wrap.open .brain-icon{
    color:var(--gold);
  }
  @keyframes brainPulse{
    0%   { transform:scale(1) rotate(0deg); }
    35%  { transform:scale(1.28) rotate(-5deg); }
    65%  { transform:scale(1.18) rotate(3deg); }
    100% { transform:scale(1) rotate(0deg); }
  }
  .brain-icon.pulse{ animation:brainPulse .45s ease; }

  .rappel-arrow{
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0; color:var(--navy);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  .rappel-arrow svg{ display:block; }
  .rappel-wrap.open .rappel-arrow{ transform:rotate(90deg); }
  .rappel-body{
    max-height:0; overflow:hidden;
    transition:max-height .38s ease, opacity .28s ease, padding .28s ease;
    opacity:0; padding:0 18px;
    font-size:0.93em; background:var(--surface);
    border-top:0px solid rgba(212,160,23,.2);
  }
  .rappel-wrap.open .rappel-body{
    max-height:1200px; opacity:1; padding:16px 18px 18px;
    border-top-width:1px;
  }
  .rappel-body ul{ margin:8px 0 0; padding-left:20px; }
  .rappel-body li{ margin-bottom:6px; color:var(--text); }
  .rappel-body strong{ color:var(--navy-deep); }

  /* Ancien style .rappel (fallback) */
  .rappel{
    border:1.5px solid rgba(212,160,23,.3); border-radius:10px;
    padding:14px 18px; margin:18px 0 24px;
    background:rgba(212,160,23,.05); font-size:0.93em; overflow-x:auto;
  }
  .rappel .label{
    display:flex; align-items:center; gap:8px; font-family:'Nunito',sans-serif; font-weight:900;
    color:var(--navy); text-transform:uppercase; font-size:0.78em; letter-spacing:1px; margin-bottom:10px;
  }
  .rappel .label::before{ content:'💡'; font-size:1.1em; }
  .rappel ul{ margin:6px 0 0; padding-left:20px; }
  .rappel li{ margin-bottom:4px; }

  /* ── TABLEAU DE DONNÉES ── */
  table.data{
    border-collapse:collapse; width:100%; margin:16px 0;
    font-family:'Nunito',sans-serif; font-size:0.85em;
    display:block; overflow-x:auto; white-space:nowrap;
  }
  table.data th, table.data td{
    border:1px solid var(--border); padding:7px 10px; text-align:center;
  }
  table.data th{ background:var(--navy); color:white; font-weight:800; }
  table.data td{ color:var(--text); background:white; }
  table.data tr:nth-child(even) td{ background:var(--surface2); }

  /* ── MATH ── */
  mjx-container[display="true"]{
    overflow-x:auto; overflow-y:hidden; max-width:100%;
    -webkit-overflow-scrolling:touch;
    padding:6px 0;
  }

  /* ── SIGNATURE ── */
  .signature{
    color:var(--text2); text-align:right; font-size:0.85em;
    margin-top:60px; font-family:'Nunito',sans-serif;
  }

  /* ── CORRECTION (details/summary) ── */
  details.correction{
    margin:20px 0 40px; border:1.5px solid var(--border);
    border-radius:12px; overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  details.correction > summary{
    cursor:pointer; list-style:none; padding:14px 20px;
    font-family:'Nunito',sans-serif; font-weight:900; font-size:0.92em;
    color:white;
    background:linear-gradient(90deg, var(--navy) 0%, var(--navy-deep) 100%);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    -webkit-user-select:none; user-select:none; transition:filter .15s ease;
  }
  details.correction > summary:hover{ filter:brightness(1.12); }
  details.correction > summary:active{ filter:brightness(0.92); }
  details.correction[open] > .corr-body{ animation:fadeSlide .3s ease; }
  details.correction > summary::-webkit-details-marker{ display:none; }
  details.correction > summary::marker{ content:''; }
  details.correction > summary .arrow{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; flex-shrink:0;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  details.correction > summary .arrow svg{ display:block; }
  details.correction[open] > summary .arrow{ transform:rotate(90deg); }
  details.correction > summary .corr-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; flex-shrink:0;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
  }
  details.correction > summary .corr-icon svg{ display:block; }
  details.correction[open] > summary .corr-icon{ transform:rotate(90deg); }
  details.correction > summary .corr-txt{ flex:1; }
  details.correction > summary .corr-txt-open{ display:none; }
  details.correction[open] > summary .corr-txt{ display:none; }
  details.correction[open] > summary .corr-txt-open{ display:block; }
  .corr-body{ padding:20px 20px 10px; background:white; }

  /* ── FOOTER ── */
  .footer{
    background:var(--navy); color:white; padding:28px 32px; width:100%;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:16px; margin-top:60px;
    font-family:'Nunito',sans-serif;
    box-shadow:0 -2px 12px rgba(0,0,0,.15);
  }
  .footer-left{ display:flex; align-items:center; gap:12px; }
  .footer-brand{ font-weight:800; font-size:16px; color:white; }
  .footer-copy{ font-size:12px; color:rgba(255,255,255,.6); margin-top:3px; }
  .footer-links{ display:flex; gap:20px; flex-wrap:wrap; }
  .footer-links a{
    color:rgba(255,255,255,.7); text-decoration:none;
    font-size:13px; font-weight:700; transition:color .2s;
  }
  .footer-links a:hover{ color:var(--gold); }

  /* ── RESPONSIVE ── */
  @media(max-width:600px){
    .topbar{ padding:0 16px; }
    .bac-hero{ padding:28px 16px 22px; }
    .bac-container{ padding:20px 12px 80px; }
    .footer{ padding:20px 16px; }
    #bac-content h1{ font-size:1.25em; margin-top:18px; }
    #bac-content h2{ font-size:1em; margin-top:36px; }
    .step, .result, .note, .rappel{ padding:12px 12px; }
    .rappel-body{ padding:0 12px; }
    .rappel-wrap.open .rappel-body{ padding:12px 12px 14px; }
    details.correction > summary{ padding:12px 14px; font-size:0.85em; }
    mjx-container[display="true"]{ font-size:88% !important; }
  }

  /* ── FILIGRANE NERVEUX (Logo ImgBB) ── */
  #nx-watermark {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(95vw, 900px);
    aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    background: url("https://i.ibb.co/35D50p1X/watermark.jpg") center/contain no-repeat;
    opacity: 0.10;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: multiply;
  }
</style>
</head>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || 'bac-d-2024-s1';

  var registry = window.BAC_CONTENT_REGISTRY || {};
  var wrap = document.getElementById('bac-content');
  var html = registry[id];

  if(html){
    wrap.innerHTML = html;

    // ── Peupler le hero band ──────────────────────────────────────
    var heroTitle = document.getElementById('bac-hero-title');
    var heroSub   = document.getElementById('bac-hero-sub');
    var contentH1 = wrap.querySelector('h1');
    var contentSub = wrap.querySelector('.subtitle');
    if(contentH1 && heroTitle){
      heroTitle.textContent = contentH1.textContent;
      contentH1.style.display = 'none'; // masquer le doublon
    }
    if(contentSub && heroSub){
      heroSub.textContent = contentSub.textContent;
      contentSub.style.display = 'none';
    }
    // ─────────────────────────────────────────────────────────────

    // ── SVG Play/Flèche fourni par l'utilisateur (avec animation 90deg vers le bas) ──
    var SVG_PLAY = '<svg width="12" height="12" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M500.203,236.907L30.869,2.24c-6.613-3.285-14.443-2.944-20.736,0.939C3.84,7.083,0,13.931,0,21.333v469.333 c0,7.403,3.84,14.251,10.133,18.155c3.413,2.112,7.296,3.179,11.2,3.179c3.264,0,6.528-0.747,9.536-2.24l469.333-234.667 C507.435,271.467,512,264.085,512,256S507.435,240.533,500.203,236.907z" fill="currentColor"/></svg>';
    var SVG_CHEVRON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="4,2 10,7 4,12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';

    wrap.querySelectorAll('details.correction').forEach(function(det) {
      var sum = det.querySelector('summary');
      if(!sum) return;
      sum.innerHTML =
        '<span class="corr-icon">' + SVG_PLAY + '</span>'
        + '<span class="corr-txt">Afficher la correction</span>'
        + '<span class="corr-txt-open">Masquer la correction</span>'
        + '<span class="arrow">' + SVG_CHEVRON + '</span>';
    });
    // ─────────────────────────────────────────────────────────────

    var SVG_BRAIN = '<svg viewBox="0 0 100 90" class="brain-icon" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M35 8 C22 8 14 18 15 28 C7 31 4 42 10 50 C6 58 10 68 20 70 C21 78 30 84 40 82 C44 84 48 84 50 82 L50 20 C50 12 43 8 35 8 Z M50 20 L50 82 C52 84 56 84 60 82 C70 84 79 78 80 70 C90 68 94 58 90 50 C96 42 93 31 85 28 C86 18 78 8 65 8 C57 8 50 12 50 20 Z"'
      + ' fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>'
      + '<path d="M35 8 C40 14 38 22 32 26 M65 8 C60 14 62 22 68 26 M15 28 C24 30 28 38 24 44 M85 28 C76 30 72 38 76 44 M10 50 C20 52 26 58 22 64 M90 50 C80 52 74 58 78 64"'
      + ' fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.6"/>'
      + '</svg>';
    var SVG_CHEVRON_RIGHT = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline points="6,3 12,9 6,15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    wrap.querySelectorAll('.rappel').forEach(function(rappel) {
      var labelEl = rappel.querySelector('.label');
      var labelText = labelEl ? labelEl.textContent.trim() : 'Rappel de cours';

      var bodyContent = document.createElement('div');
      Array.from(rappel.childNodes).forEach(function(node) {
        if(node !== labelEl) bodyContent.appendChild(node.cloneNode(true));
      });

      var wrap_div = document.createElement('div');
      wrap_div.className = 'rappel-wrap';

      var btn = document.createElement('button');
      btn.className = 'rappel-toggle';
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML =
        '<span class="rappel-toggle-left">'
        + SVG_BRAIN
        + labelText
        + '</span>'
        + '<span class="rappel-arrow">' + SVG_CHEVRON_RIGHT + '</span>';

      var body = document.createElement('div');
      body.className = 'rappel-body';
      body.appendChild(bodyContent);

      btn.addEventListener('click', function() {
        var isOpen = wrap_div.classList.toggle('open');
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        var brainEl = btn.querySelector('.brain-icon');
        if(brainEl) {
          brainEl.classList.remove('pulse');
          void brainEl.offsetWidth; // reset
          brainEl.classList.add('pulse');
          brainEl.addEventListener('animationend', function(){
            brainEl.classList.remove('pulse');
          }, { once: true });
        }
        if(isOpen && window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise([body]).catch(function(){});
        }
      });

      wrap_div.appendChild(btn);
      wrap_div.appendChild(body);
      rappel.parentNode.replaceChild(wrap_div, rappel);
    });
    // ─────────────────────────────────────────────────────────────

    function typesetWhenReady(){
      if(window.MathJax && MathJax.typesetPromise){
        MathJax.startup.promise.then(function(){
          MathJax.typesetPromise([wrap]).catch(function(){});
        });
      } else {
        setTimeout(typesetWhenReady, 200);
      }
    }
    typesetWhenReady();
  } else {
    wrap.innerHTML = '<div style="text-align:center;padding:80px 20px;">'
      +'<h2>Sujet introuvable</h2>'
      +'<p>Le sujet demandé n\'est pas encore disponible (id : <code>'+id+'</code>).</p>'
      +'<a href="exercices.html" style="color:#4fc1ff;">← Retour aux exercices</a>'
      +'</div>';
    revealPage();
  }
})();
</script>
</body>
</html>
